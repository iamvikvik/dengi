<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fde7f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Деньги">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Мои деньги</title>
<style>:root{--bg:#fbf4f1;--card:#ffffff;--ink:#2b1d2a;--mut:#9a8793;--pink:#f0388b;--pink2:#ff7db5;--lav:#ece6ff;--lav2:#8b74e8;--beige:#f8ecdf;--line:#f1e4ea;--sh:0 6px 18px rgba(170,90,130,.10);--sh2:0 3px 8px rgba(170,90,130,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{cursor:pointer;font-family:inherit}
/* шапка */
.hdr{flex:none;padding:calc(6px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(180deg,#fde7f0,var(--bg))}
.hrow{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.hrow img{width:34px;height:34px;border-radius:50%;box-shadow:var(--sh2);object-fit:cover}
.brand{flex:1;min-width:0}.hrow h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:600}
.gear{width:34px;height:34px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh2);font-size:16px;display:flex;align-items:center;justify-content:center}
.stats{border-radius:22px;padding:11px 12px 10px;color:#fff;background:linear-gradient(135deg,#ff6aa8 0%,#f0388b 55%,#c94bd6 120%);box-shadow:0 10px 22px rgba(240,56,139,.30);position:relative;overflow:hidden}
.stats:before{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.13)}
.balrow{display:flex;align-items:center;gap:8px;position:relative}
.bl{flex:1;min-width:0}.bl span{font-size:11px;font-weight:700;opacity:.9}
.bl b{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl i{font-style:normal;font-size:11.5px;opacity:.85}
.tg{display:flex;background:rgba(255,255,255,.22);border-radius:99px;padding:3px;flex:none}
.tg button{border:0;background:none;color:#fff;font-size:12px;font-weight:800;padding:6px 10px;border-radius:99px;min-width:34px}
.tg button.on{background:#fff;color:var(--pink)}
.mini{display:flex;gap:7px;margin-top:8px;position:relative}
.st{flex:1;min-width:0;background:rgba(255,255,255,.2);border-radius:14px;padding:6px 9px}
.st span{display:block;font-size:10px;font-weight:700;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{display:inline;font-size:13.5px;font-weight:800;white-space:nowrap}
.st i{font-style:normal;font-size:10.5px;opacity:.85;margin-left:5px;white-space:nowrap}
.st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* страницы */
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;scroll-snap-align:start;overflow-y:auto;padding:2px 10px 26px;-webkit-overflow-scrolling:touch}
.sec{margin-top:7px;background:var(--card);border-radius:20px;padding:7px 4px 4px;box-shadow:var(--sh)}
.sh{display:flex;align-items:center;gap:6px;padding:0 8px 2px}
.si{width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#ffe3ef;flex:none}
.sh h2{margin:0;font-size:13px;font-weight:800;letter-spacing:-.1px}
.sh small{font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh small:before{content:"· "}
.s-wal .si{background:var(--lav)}.s-cat .si{background:var(--beige)}.s-save .si{background:#dff5e8}.s-goal .si{background:#ffe3ef}
.s-save{background:linear-gradient(180deg,#f3fbf6,#fff)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.cell{display:flex;flex-direction:column;align-items:center;padding:3px 1px 4px;text-align:center;min-width:0;touch-action:manipulation}
.cell .nm{font-size:10.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px;line-height:1.25;margin-top:1px}
.cell.add .nm{color:var(--mut);font-weight:600}
.orbw{border-radius:50%;padding:2.5px;background:conic-gradient(var(--c) calc(var(--p,0)*1%),#f3e3ea 0)}
.orbw.noring{background:none}
.orb{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle at 35% 28%,#fff,var(--c) 75%);box-shadow:0 4px 9px rgba(160,80,120,.18);overflow:hidden;position:relative;transition:transform .15s}
.orb img,.hrw .ic img,.icgrid img,.hrow img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.orb img{width:100%;height:100%;object-fit:cover;display:block}
.orb .bt{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.5px}
.orb.ghost{background:#fbf3f6;box-shadow:inset 0 0 0 1.5px #ecd3df;color:#d58aae;font-size:24px;font-weight:300}
.orb.sm{width:44px;height:44px;font-size:21px;flex:none}
.amt{font-size:10px;line-height:1.2;max-width:100%}
.amt b{display:block;font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt b.neg{color:#d23a6c}
.amt i{display:block;font-style:normal;color:var(--mut);font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt i.ask{color:var(--pink);font-weight:700}
.amt u{display:block;text-decoration:none;color:var(--lav2);font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.dragging .cell.tgt .orb{transform:scale(1.05);box-shadow:0 0 0 2.5px rgba(240,56,139,.45),0 4px 9px rgba(160,80,120,.18)}
body.dragging .cell.hov .orb{transform:scale(1.2);box-shadow:0 0 0 3.5px var(--pink),0 8px 16px rgba(240,56,139,.35)}
.cell.lift{opacity:.35}
.dghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:54px;height:54px;transform:translate(-100px,-100px);filter:drop-shadow(0 10px 12px rgba(120,40,80,.35))}
.dghost .orb{width:54px;height:54px}
.banner{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:70;background:var(--ink);color:#fff;border-radius:18px;padding:11px 14px;display:none;align-items:center;gap:10px;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.banner.show{display:flex}.banner span{flex:1}
.banner button{border:0;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;background:#fff;color:var(--ink)}
.hint{margin:6px 10px 2px;font-size:11px;color:var(--mut);line-height:1.35}.hint.c{text-align:center;margin-top:10px}
/* меню */
nav{flex:none;display:flex;gap:4px;background:#fff;padding:5px 8px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(170,90,130,.10);border-radius:22px 22px 0 0}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:10px;font-weight:700;padding:4px 0;border-radius:14px}
nav button span{display:block;font-size:19px;filter:grayscale(1);opacity:.55;line-height:1.2}
nav button.on{color:var(--pink);background:#ffe8f2}nav button.on span{filter:none;opacity:1}
/* листы */
.sheetbg{position:fixed;inset:0;background:rgba(60,25,45,.42);z-index:80;display:none;align-items:flex-end;justify-content:center}
.sheetbg.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
label{display:block;font-size:11px;font-weight:800;color:var(--mut);margin:12px 0 5px;letter-spacing:.04em}
.f{width:100%;border:1.5px solid #f0dbe5;background:#fff;border-radius:14px;padding:12px 13px;font:inherit;font-size:16px;color:var(--ink);outline:0;min-width:0}
.f:focus{border-color:var(--pink2);box-shadow:0 0 0 3px #ffe1ee}
select.f{appearance:none;-webkit-appearance:none}
.two{display:flex;gap:8px}.two>*{flex:1;min-width:0}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:16px;margin-top:12px;color:#fff;background:linear-gradient(135deg,#ff6aa8,#f0388b);box-shadow:0 8px 16px rgba(240,56,139,.28)}
.btn:active{transform:scale(.98)}
.btn.alt{background:var(--lav);color:#4b3a8c;box-shadow:none}
.btn.del{background:none;color:#d23a6c;box-shadow:none;margin-top:2px;font-size:14px}
.btn.sm{padding:10px;font-size:14px;margin-top:8px}
.btn:disabled{opacity:.5;cursor:wait}
.seg{display:flex;background:#fff;border-radius:99px;padding:3px;margin:8px 0;box-shadow:inset 0 0 0 1.5px #f0dbe5}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 4px;font-size:13px;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--pink);color:#fff}
.big{background:#fff;border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:var(--sh2)}
.big b{font-size:22px;font-weight:800}.big i{font-style:normal;color:var(--mut);font-size:13px;margin-left:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv span{color:var(--mut)}.kv b{text-align:right}
.bar{height:9px;background:#f6e2eb;border-radius:99px;overflow:hidden;margin:8px 0}
.bar div{height:100%;border-radius:99px;background:linear-gradient(90deg,#ff7db5,#f0388b)}
.warn{color:#d23a6c;font-weight:700;font-size:13px;margin-top:6px}
.skipnote{background:#e8f8ee;color:#2d6b48;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.4;margin:8px 0;font-weight:600}
.arr{font-size:20px;color:var(--mut)}
.hist{margin-top:10px}.hist h3{margin:10px 0 4px;font-size:11.5px;letter-spacing:.08em;color:var(--mut)}
.hrw{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;min-height:54px}
.hrw .ic{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;overflow:hidden;box-shadow:var(--sh2)}
.hrw .ic img{width:100%;height:100%;object-fit:cover}
.hrw .tx{flex:1;min-width:0}.hrw .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrw .tx i{font-style:normal;font-size:11.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.hrw .am{text-align:right;flex:none}.hrw .am b{display:block;font-size:14px}.hrw .am i{font-style:normal;font-size:11px;color:var(--mut)}
.hrw .am.in b{color:#2f8a57}.hrw .am.sv b{color:#2f8a57}
.dayh{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.06em;margin:14px 2px 2px}
/* выбор значка */
.icgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-height:190px;overflow-y:auto;background:#fff;border-radius:16px;padding:6px;margin-top:8px;box-shadow:inset 0 0 0 1.5px #f0dbe5}
.icgrid button{border:0;background:none;font-size:23px;padding:3px 0;border-radius:12px;min-height:42px;display:flex;align-items:center;justify-content:center}
.icgrid button.im img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.icgrid button.on{background:#ffe1ee;box-shadow:0 0 0 2px var(--pink)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw button{width:32px;height:32px;border-radius:50%;border:0;box-shadow:var(--sh2)}
.sw button.on{outline:3px solid var(--pink);outline-offset:2px}
.pvw{display:flex;align-items:center;gap:12px}.pvw .orb{flex:none}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;font-weight:600;color:var(--ink)}
.chk input{width:22px;height:22px;accent-color:var(--pink)}
/* аналитика */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 2px}
.chip{flex:none;border:0;border-radius:99px;padding:8px 13px;font-size:13px;font-weight:800;background:#fff;color:var(--mut);box-shadow:var(--sh2)}
.chip.on{background:var(--pink);color:#fff}
.donut{position:relative;width:220px;height:220px;margin:6px auto}
.donut svg{width:100%;height:100%}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 50px}
.donut .mid small{font-size:11px;color:var(--mut);font-weight:700}.donut .mid b{font-size:17px;font-weight:800}.donut .mid i{font-style:normal;font-size:12px;color:var(--mut)}
.lg{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.lg .dot{width:12px;height:12px;border-radius:50%;flex:none}
.lg .pc{font-weight:800;width:44px;flex:none;font-size:15px}
.lg .nm{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .am{text-align:right;font-size:13px;font-weight:700}.lg .am i{display:block;font-style:normal;font-size:11px;color:var(--mut);font-weight:500}
.sumrow{display:flex;gap:7px;margin:6px 0}
.sumrow div{flex:1;background:#fff;border-radius:16px;padding:9px 10px;box-shadow:var(--sh2);min-width:0}
.sumrow span{font-size:10.5px;font-weight:700;color:var(--mut)}.sumrow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sumrow i{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.sumrow div:nth-child(1){background:#fff0f6}.sumrow div:nth-child(2){background:var(--beige)}.sumrow div:nth-child(3){background:var(--lav)}
.savebox{background:#e8f8ee;border-radius:16px;padding:9px 12px;margin:6px 0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.savebox span{font-size:12px;font-weight:700;color:#2d6b48;flex:1}.savebox b{font-size:15px;color:#2d6b48}.savebox i{font-style:normal;font-size:11px;color:#5f8f73}
.sec[style]{padding:12px 10px!important}
/* советы */
.tip{background:#fff;border-radius:20px;padding:13px;margin-top:9px;display:flex;gap:12px;box-shadow:var(--sh)}
.tip .e{font-size:24px;flex:none}.tip h4{margin:0 0 3px;font-size:15px;font-weight:800}.tip p{margin:0;font-size:13.5px;line-height:1.45;color:#5b4a56}
.tip.bad{box-shadow:inset 4px 0 0 #f0388b,var(--sh)}.tip.good{box-shadow:inset 4px 0 0 #3fae72,var(--sh)}
.bunnysay{display:flex;gap:12px;align-items:center;margin-top:8px}.bunnysay img{width:60px;height:60px;border-radius:50%;box-shadow:var(--sh2);flex:none;object-fit:cover}
.bunnysay div{background:#ffe8f2;border-radius:18px;padding:11px 13px;font-size:13.5px;line-height:1.4}
.empty{text-align:center;padding:20px 14px;color:var(--mut);font-size:14px;line-height:1.45}.empty img{width:110px;height:110px;border-radius:50%;box-shadow:var(--sh);margin-bottom:10px;object-fit:cover}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:95;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hide{display:none!important}
textarea.f{height:90px;font-size:12px}
textarea.f.op-note{min-height:120px;height:120px;font-size:16px;line-height:1.5;resize:vertical;overflow:hidden}
.alert{background:#fff4dc;border-radius:14px;padding:9px 12px;font-size:12.5px;margin:7px 0 0;color:#7a5a12;font-weight:600}
.saved-note{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;background:#fff;border-radius:16px;padding:13px;margin:10px 0;-webkit-user-select:text;user-select:text}
.income-photo{display:block;max-width:100%;max-height:55dvh;width:auto;height:auto;object-fit:contain;margin:12px auto;border-radius:16px}
/* обрезка */
.crop{position:fixed;inset:0;z-index:100;background:#1d1219;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 20px calc(20px + env(safe-area-inset-bottom));gap:16px}
.cr-t{color:#fff;font-weight:700;font-size:15px}
.cr-v{position:relative;width:min(78vw,300px);height:min(78vw,300px);overflow:hidden;touch-action:none;border-radius:12px}
.cr-v img{position:absolute;left:50%;top:50%;transform-origin:center;max-width:none;pointer-events:none;-webkit-user-drag:none}
.cr-m{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(29,18,25,.62);outline:2px solid rgba(255,255,255,.9);pointer-events:none}
.crop input[type=range]{width:min(78vw,300px);accent-color:var(--pink)}
.cr-b{display:flex;gap:10px;width:min(78vw,300px)}.cr-b .btn{margin:0}.cr-b .btn.del{color:#fff;background:rgba(255,255,255,.12);border-radius:16px}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--lav2);outline-offset:3px}
@media(min-width:700px){body{max-width:620px;margin:0 auto}html{background:#f6e8ef}.orb{width:60px;height:60px}.cell .nm{font-size:12px}.amt b{font-size:12.5px}.amt i{font-size:11px}}
@media(max-width:350px){.orb{width:44px;height:44px}.bl b{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hrow"><img src="logo.png" alt=""><div class="brand"><h1>Мои деньги</h1><small>Твой личный бухгалтер</small></div><button class="gear" id="gear" aria-label="Настройки">⚙️</button></div>
  <div class="stats" id="stats"></div>
</div>
<div id="pages">
  <div class="page" id="pg0"></div>
  <div class="page" id="pg1"></div>
  <div class="page" id="pg2"></div>
  <div class="page" id="pg3"></div>
</div>
<nav id="nav">
  <button data-i="0" class="on"><span>💗</span>Деньги</button>
  <button data-i="1"><span>📊</span>Аналитика</button>
  <button data-i="2"><span>💡</span>Советы</button>
  <button data-i="3"><span>🧾</span>Журнал</button>
</nav>
<div class="banner" id="banner"><span id="bannerT"></span><button id="bannerX">Отмена</button></div>
<div class="sheetbg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
(function(){
'use strict';
/* ================= базовое ================= */
var KEY='money_v1',RKEY='money_rates_v1',MAXAGE=3*3600*1000;
var CUR={RUB:{s:'₽',n:'Рубли',f:'🇷🇺'},AED:{s:'AED',n:'Дирхамы',f:'🇦🇪'},USD:{s:'$',n:'Доллары',f:'🇺🇸'},EUR:{s:'€',n:'Евро',f:'🇪🇺'},TRY:{s:'₺',n:'Лиры',f:'🇹🇷'},AMD:{s:'֏',n:'Драмы',f:'🇦🇲'}};
var CODES=Object.keys(CUR);
var FB={USD:1,RUB:84.989692,EUR:0.892383,AED:3.6725,AMD:361.957381,TRY:49.339277};
var R=Object.assign({},FB),RI={date:'2026-10-10',live:false,t:0};
var COLORS=['#bce6cc','#ffad55','#ffdd78','#cfc4f4','#f5b8ce','#a9d9ed','#e5d6ba','#ef967d'];
var DEF={src:'#ffd6e7',wal:'#e6dcff',goal:'#f0388b',cat:'#ffe6d1',save:'#d9f2e3'};
var S=blank(),D={},swallow=0,pick=null,period='m0';
function blank(){return{v:1,set:{main:'RUB',bk:0},src:[],wal:[],goal:[],cat:[],save:[],ops:[]}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fd(s){if(!s)return'';var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function fds(s){var p=s.split('-');return p[2]+'.'+p[1]}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},2000)}
function find(k,id){return S[k].filter(function(x){return x.id===id})[0]}
function r2(n){return Math.round(n*100)/100}
function parse(v){v=String(v||'').replace(/\s/g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)?n:NaN}
function conv(a,f,t){return f===t?a:a/R[f]*R[t]}
function fmt(n,cur,ap){
  if(!isFinite(n))n=0;var abs=Math.abs(n),mx=ap?(abs>=100?0:2):(abs>=10000?0:2);
  if(cur==='AMD')mx=0;
  var s=n.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:mx}).replace('-','−');
  var c=CUR[cur].s;return(cur==='USD'||cur==='EUR')?(n<0?'−':'')+c+s.replace('−',''):s+' '+c;
}
function two(rub,aed){var m=S.set.main==='AED';return '<b>'+fmt(m?aed:rub,m?'AED':'RUB',true)+'</b><i>'+fmt(m?rub:aed,m?'RUB':'AED',true)+'</i>'}
function lines(a,cur){ // сумма в своей валюте + RUB/AED
  var h='<b>'+fmt(a,cur)+'</b>';
  if(cur!=='RUB')h+='<i>'+fmt(conv(a,cur,'RUB'),'RUB',true)+'</i>';
  if(cur!=='AED')h+='<i>'+fmt(conv(a,cur,'AED'),'AED',true)+'</i>';
  return h;
}
function bothTxt(a,cur){var p=[];if(cur!=='RUB')p.push(fmt(conv(a,cur,'RUB'),'RUB',true));if(cur!=='AED')p.push(fmt(conv(a,cur,'AED'),'AED',true));
  if(cur==='RUB'||cur==='AED'||true)return '≈ '+p.join(' · ')}
function sum2(cur,aed){return fmt(aed,'AED',true)+' (≈ '+fmt(aed*R.RUB/R.AED,'RUB',true)+')'}

/* ================= хранение ================= */
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1&&Array.isArray(d.ops)){S=d;S.set=Object.assign({main:'RUB',bk:0},S.set||{});['src','wal','goal','cat','save'].forEach(function(k){S[k]=S[k]||[]})}}catch(e){}
  migrate();
  try{var r=JSON.parse(localStorage.getItem(RKEY));if(r&&r.R&&r.R.RUB){R=Object.assign({},FB,r.R);RI=r.I}}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Не удалось сохранить: память заполнена. Убери фото или освободи место.');return false}}
function getJSON(u){var c=new AbortController(),t=setTimeout(function(){c.abort()},9000);return fetch(u,{signal:c.signal,cache:'no-store'}).then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r.json()})}
function loadRates(force){
  if(!force&&RI.live&&RI.t&&Date.now()-RI.t<MAXAGE)return Promise.resolve();
  return getJSON('https://open.er-api.com/v6/latest/USD').then(function(j){
    if(j.result!=='success')throw 0;var n={USD:1};CODES.forEach(function(c){if(!(j.rates[c]>0))throw 0;n[c]=j.rates[c]});
    return{R:n,I:{date:new Date(j.time_last_update_utc).toISOString().slice(0,10),live:true,t:Date.now()}}
  }).catch(function(){return getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json').then(function(j){
    var n={USD:1};CODES.forEach(function(c){var v=j.usd[c.toLowerCase()];if(!(v>0))throw 0;n[c]=v});return{R:n,I:{date:j.date,live:true,t:Date.now()}}})
  }).then(function(x){R=x.R;RI=x.I;try{localStorage.setItem(RKEY,JSON.stringify(x))}catch(e){}render();if(force)toast('Курс обновлён')})
  .catch(function(){RI.live=false;if(force)toast('Не удалось обновить курс');render()})
}

function migrate(){
  if(S.set.v2)return;
  ['src','wal','goal','cat','save'].forEach(function(k){
    S[k]=S[k]||[];var used={},out=[];
    PLAN[k].forEach(function(p,pi){
      var al=p[p.length-1],cur=k==='wal'?p[2]:null;
      var it=S[k].filter(function(x){return !used[x.id]&&(!cur||x.cur===cur)&&matchName(x.name,al)})[0];
      if(!it){it={id:uid()+k+pi,name:p[0],color:PCOL[k]};
        if(k==='wal'){it.cur=p[2];it.init=0}
        if(k==='cat')it.want=!!p[2];
        if(k==='goal'){it.type=p[2];it.cur=p[3];it.target=0;it.deadline=''}
      }
      it.icon='i:'+p[1];if(k!=='goal')it.color=PCOL[k];used[it.id]=1;out.push(it);
    });
    S[k].forEach(function(x){if(!used[x.id])out.push(x)});
    S[k]=out;
  });
  S.set.v2=1;save();
}

  else if(o.t==='exp'){x=find('cat',o.x);tx=(w?w.name:'?')+' → '+(x?x.name:'?');ic=x?x.icon:'💸'}
  else if(o.t==='tr'){x=find('wal',o.x);tx=(w?w.name:'?')+' → '+(x?x.name:'?');ic='🔄'}
  else if(o.t==='res'){x=find('goal',o.x);tx=(o.a<0?'Вернули из отложенного: ':'Отложено: ')+(w?w.name:'?')+' → '+(x?x.name:'?');ic='🔒'}

function photoHTML(data){return typeof data==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(data)?'<img class="income-photo" src="'+esc(data)+'" alt="Фото к записи дохода">':''}
function compressPhoto(file){
  return new Promise(function(resolve,reject){
    if(file.type&&file.type.indexOf('image/')!==0){reject(new Error('image required'));return}
    var url=URL.createObjectURL(file),img=new Image(),done=false;
    var timer=setTimeout(function(){finish(new Error('timeout'))},20000);
    function finish(error,data){if(done)return;done=true;clearTimeout(timer);URL.revokeObjectURL(url);if(error)reject(error);else resolve(data)}
    img.onerror=function(){finish(new Error('decode'))};
    img.onload=function(){try{
      var scale=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      var ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      var quality=.78,data=canvas.toDataURL('image/jpeg',quality);
      while(data.length>180000&&quality>.35){quality-=.1;data=canvas.toDataURL('image/jpeg',quality)}
      if(data.length>220000){var small=document.createElement('canvas');small.width=Math.max(1,Math.round(canvas.width*.65));small.height=Math.max(1,Math.round(canvas.height*.65));small.getContext('2d').drawImage(canvas,0,0,small.width,small.height);data=small.toDataURL('image/jpeg',.55)}
      finish(null,data);
    }catch(error){finish(error)}};img.src=url;
  });
}

/* ================= перетаскивание ================= */
function validT(sk,dk){return(sk==='src'&&dk==='wal')||(sk==='wal'&&(dk==='wal'||dk==='cat'||dk==='goal'||dk==='save'))}
function cellAt(x,y){var els=document.elementsFromPoint(x,y);for(var i=0;i<els.length;i++){var c=els[i].closest&&els[i].closest('.cell[data-k]');if(c)return c}return null}
function hit(x,y){var k=st.c.dataset.k,a=cellAt(x,y-39),b=cellAt(x,y);function ok(c){return c&&c!==st.c&&validT(k,c.dataset.k)}return ok(a)?a:ok(b)?b:null}
var st=null,ghost=null,scrollT=null,lastY=0;
function begin(x,y){
  st.on=true;document.body.classList.add('dragging');
  var o=st.c.querySelector('.orb');ghost=document.createElement('div');ghost.className='dghost';ghost.appendChild(o.cloneNode(true));ghost.firstChild.style.setProperty('--c',st.c.querySelector('.orbw').style.getPropertyValue('--c'));document.body.appendChild(ghost);
  st.c.classList.add('lift');var sk=st.c.dataset.k;
  document.querySelectorAll('#pg0 .cell[data-k]').forEach(function(c){if(c!==st.c&&validT(sk,c.dataset.k))c.classList.add('tgt')});
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  mv(x,y);
  scrollT=setInterval(function(){var p=$('pg0');if(lastY>innerHeight-120)p.scrollTop+=9;else if(lastY<190)p.scrollTop-=9},16);
}
function mv(x,y){lastY=y;ghost.style.transform='translate('+(x-27)+'px,'+(y-66)+'px) scale(1.15)';
  document.querySelectorAll('.cell.hov').forEach(function(c){c.classList.remove('hov')});
  var c=hit(x,y);if(c)c.classList.add('hov')}
function end(x,y,cancel){
  clearTimeout(st.tm);clearInterval(scrollT);
  if(st.on){
    var c=cancel?null:hit(x,y);var sc=st.c;
    document.body.classList.remove('dragging');sc.classList.remove('lift');if(ghost){ghost.remove();ghost=null}
    document.querySelectorAll('.cell.tgt,.cell.hov').forEach(function(e){e.classList.remove('tgt','hov')});
    swallow=Date.now()+450;
    if(c&&c!==sc&&validT(sc.dataset.k,c.dataset.k))amountSheet(sc.dataset.k,sc.dataset.id,c.dataset.k,c.dataset.id);
  }
  st=null;
}

  var root=$('pg0');
  root.addEventListener('touchstart',function(e){
    if(st)return;var c=e.target.closest('.cell[data-k]');if(!c||(c.dataset.k!=='src'&&c.dataset.k!=='wal'))return;
    var t=e.touches[0];st={c:c,x:t.clientX,y:t.clientY,on:false,touch:true};st.tm=setTimeout(function(){if(st&&!st.on)begin(st.x,st.y)},260);
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!st||!st.touch)return;var t=e.touches[0];
    if(!st.on){if(Math.abs(t.clientX-st.x)>9||Math.abs(t.clientY-st.y)>9){clearTimeout(st.tm);st=null}return}
    e.preventDefault();mv(t.clientX,t.clientY);st.lx=t.clientX;st.ly=t.clientY;
  },{passive:false});
  document.addEventListener('touchend',function(e){if(!st||!st.touch)return;if(st.on){e.preventDefault();var t=e.changedTouches[0];end(t.clientX,t.clientY)}else{clearTimeout(st.tm);st=null}},{passive:false});
  document.addEventListener('touchcancel',function(){if(st&&st.touch)end(0,0,true)});
  root.addEventListener('mousedown',function(e){
