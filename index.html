<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff850a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Деньги">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Мои деньги</title>
<style>
:root{--bg:#eadfcf;--card:#f6efe4;--ink:#4a3328;--mut:#9b8571;--pink:#f2a58f;--coin:#e8803f;--olive:#6f6e3a;--line:rgba(120,90,60,.16);--sh:0 10px 18px rgba(120,80,50,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
/* header */
.hdr{flex:none;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg)}
.hrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hrow img{width:38px;height:38px;border-radius:50%;box-shadow:0 4px 8px rgba(120,80,50,.25)}
.hrow h1{margin:0;font-size:20px;font-weight:800;flex:1;letter-spacing:-.3px}
.gear{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 8px rgba(120,80,50,.18),inset 0 2px 3px #fff;font-size:18px}
.stats{display:flex;gap:8px}
.st{flex:1;min-width:0;background:var(--card);border-radius:18px;padding:8px 9px;box-shadow:0 4px 10px rgba(120,80,50,.14),inset 0 2px 3px rgba(255,255,255,.9)}
.st span{display:block;font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st i{display:block;font-style:normal;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.pk b{color:#c2573b}
/* pages */
#pages{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pages::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;scroll-snap-align:start;overflow-y:auto;padding:4px 12px 40px;-webkit-overflow-scrolling:touch}
.sec{margin-top:10px;background:var(--card);border-radius:26px;padding:10px 6px 8px;box-shadow:0 6px 14px rgba(120,80,50,.1),inset 0 2px 3px rgba(255,255,255,.9)}
.sec h2{margin:2px 10px 2px;font-size:11.5px;letter-spacing:.09em;color:var(--mut);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 0}
.cell{display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;text-align:center;min-width:0;touch-action:manipulation}
.cell .nm{font-size:11.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;height:15px}
.orbw{margin:5px 0 4px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p,0)*1%),rgba(120,90,60,.12) 0)}
.orbw.noring{background:none;padding:3px}
.orb{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:#e8803f;background:radial-gradient(circle at 32% 24%,color-mix(in srgb,var(--c) 45%,#fff),var(--c) 58%,color-mix(in srgb,var(--c) 78%,#000));box-shadow:0 7px 12px rgba(100,60,30,.28),inset 0 -5px 9px rgba(0,0,0,.14),inset 0 4px 7px rgba(255,255,255,.5);overflow:hidden;position:relative;transition:transform .15s}
.orb img{width:100%;height:100%;object-fit:cover}
.orb .bt{font-size:21px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);letter-spacing:-.5px}
.orb.ghost{background:transparent;box-shadow:inset 0 0 0 2px rgba(120,90,60,.2);color:var(--mut);font-size:28px;font-weight:300}
.amt{font-size:11.5px;line-height:1.25;max-width:100%}
.amt b{display:block;font-weight:800;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt i{display:block;font-style:normal;color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt u{display:block;text-decoration:none;color:#c2573b;font-size:10px;font-weight:700}
body.dragging .cell.tgt .orb{transform:scale(1.06);box-shadow:0 0 0 3px rgba(111,110,58,.55),0 7px 12px rgba(100,60,30,.28)}
body.dragging .cell.hov .orb{transform:scale(1.2);box-shadow:0 0 0 4px #6f6e3a,0 10px 16px rgba(100,60,30,.35)}
.cell.lift{opacity:.4}
.dghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:62px;height:62px;transform:translate(-100px,-100px) scale(1.15);filter:drop-shadow(0 12px 12px rgba(80,40,20,.35))}
.dghost .orb{width:62px;height:62px}
.banner{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:70;background:#4a3328;color:#fff;border-radius:18px;padding:12px 14px;display:none;align-items:center;gap:10px;font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.banner.show{display:flex}.banner span{flex:1}
.banner button{border:0;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;background:#fff;color:#4a3328}
.hint{margin:6px 10px 2px;font-size:11.5px;color:var(--mut);line-height:1.35}
/* nav */
nav{flex:none;display:flex;background:var(--card);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(120,80,50,.12);border-radius:22px 22px 0 0}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:10.5px;font-weight:800;padding:3px 0;letter-spacing:.03em}
nav button span{display:block;font-size:21px;filter:grayscale(.7);opacity:.7}
nav button.on{color:var(--ink)}nav button.on span{filter:none;opacity:1}
/* sheets */
.sheetbg{position:fixed;inset:0;background:rgba(74,51,40,.45);z-index:80;display:none;align-items:flex-end;justify-content:center}
.sheetbg.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:30px 30px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 4px;font-size:21px;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin-bottom:8px}
label{display:block;font-size:11.5px;font-weight:800;color:var(--mut);margin:12px 0 5px;letter-spacing:.04em}
.f{width:100%;border:0;background:var(--card);border-radius:16px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);outline:0;box-shadow:inset 0 2px 5px rgba(120,80,50,.14);min-width:0}
select.f{appearance:none;-webkit-appearance:none}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.btn{width:100%;border:0;border-radius:99px;padding:15px;font:inherit;font-weight:800;font-size:16px;margin-top:12px;color:#fff;background:linear-gradient(#f08a52,#e8803f);box-shadow:0 8px 14px rgba(200,100,40,.35),inset 0 2px 4px rgba(255,255,255,.4)}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 8px rgba(120,80,50,.15),inset 0 2px 3px #fff}
.btn.del{background:none;color:#b3402a;box-shadow:none;margin-top:2px;font-size:14px}
.btn.sm{padding:10px;font-size:14px;margin-top:8px}
.seg{display:flex;background:var(--card);border-radius:99px;padding:3px;box-shadow:inset 0 2px 5px rgba(120,80,50,.14);margin:8px 0}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 4px;font:inherit;font-size:13px;font-weight:800;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(120,80,50,.2)}
.big{background:var(--card);border-radius:20px;padding:12px 14px;margin:8px 0;box-shadow:inset 0 2px 3px #fff,0 3px 8px rgba(120,80,50,.1)}
.big b{font-size:22px;font-weight:800}.big i{font-style:normal;color:var(--mut);font-size:13px;margin-left:6px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv span{color:var(--mut)}.kv b{text-align:right}
.bar{height:10px;background:rgba(120,90,60,.15);border-radius:99px;overflow:hidden;margin:8px 0}
.bar div{height:100%;border-radius:99px;background:linear-gradient(90deg,#8d8c4a,#6f6e3a)}
.warn{color:#c2573b;font-weight:700;font-size:13px;margin-top:6px}
.hist{margin-top:10px}.hist h3{margin:10px 0 4px;font-size:12px;letter-spacing:.08em;color:var(--mut)}
.hrw{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left}
.hrw .ic{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;overflow:hidden;box-shadow:inset 0 2px 3px #fff,0 2px 5px rgba(120,80,50,.15)}
.hrw .ic img{width:100%;height:100%;object-fit:cover}
.hrw .tx{flex:1;min-width:0}.hrw .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hrw .tx i{font-style:normal;font-size:11.5px;color:var(--mut)}
.hrw .am{text-align:right;flex:none}.hrw .am b{display:block;font-size:14px}.hrw .am i{font-style:normal;font-size:11px;color:var(--mut)}
.hrw .am.in b{color:#5e7a2f}
.dayh{font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.06em;margin:14px 2px 2px}
/* icon picker */
.icgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:150px;overflow-y:auto;background:var(--card);border-radius:16px;padding:6px;margin-top:8px;box-shadow:inset 0 2px 5px rgba(120,80,50,.12)}
.icgrid button{border:0;background:none;font-size:23px;padding:4px 0;border-radius:10px}
.icgrid button.on{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.2)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.sw button{width:32px;height:32px;border-radius:50%;border:0;box-shadow:inset 0 -3px 5px rgba(0,0,0,.15),inset 0 3px 4px rgba(255,255,255,.5),0 2px 5px rgba(0,0,0,.2)}
.sw button.on{outline:3px solid var(--ink);outline-offset:2px}
.pvw{display:flex;align-items:center;gap:12px}.pvw .orb{flex:none}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;font-weight:600;color:var(--ink)}
.chk input{width:22px;height:22px;accent-color:#e8803f}
/* analytics */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 2px}
.chip{flex:none;border:0;border-radius:99px;padding:8px 13px;font:inherit;font-size:13px;font-weight:800;background:var(--card);color:var(--mut);box-shadow:0 2px 6px rgba(120,80,50,.12),inset 0 2px 3px #fff}
.chip.on{background:var(--coin);color:#fff;box-shadow:0 5px 10px rgba(200,100,40,.35)}
.donut{position:relative;width:230px;height:230px;margin:6px auto}
.donut svg{width:100%;height:100%}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 52px}
.donut .mid small{font-size:11px;color:var(--mut);font-weight:700}.donut .mid b{font-size:17px;font-weight:800}.donut .mid i{font-style:normal;font-size:12px;color:var(--mut)}
.lg{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.lg .dot{width:12px;height:12px;border-radius:50%;flex:none}
.lg .pc{font-weight:800;width:44px;flex:none;font-size:15px}
.lg .nm{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg .am{text-align:right;font-size:13px;font-weight:700}.lg .am i{display:block;font-style:normal;font-size:11px;color:var(--mut);font-weight:500}
.sumrow{display:flex;gap:8px;margin:6px 0}
.sumrow div{flex:1;background:var(--card);border-radius:18px;padding:9px 10px;box-shadow:inset 0 2px 3px #fff,0 3px 8px rgba(120,80,50,.1);min-width:0}
.sumrow span{font-size:10.5px;font-weight:700;color:var(--mut)}.sumrow b{display:block;font-size:14px}.sumrow i{display:block;font-style:normal;font-size:11px;color:var(--mut)}
/* advice */
.tip{background:var(--card);border-radius:22px;padding:14px;margin-top:10px;display:flex;gap:12px;box-shadow:inset 0 2px 3px #fff,0 4px 10px rgba(120,80,50,.1)}
.tip .e{font-size:26px;flex:none}.tip h4{margin:0 0 3px;font-size:15px;font-weight:800}.tip p{margin:0;font-size:13.5px;line-height:1.45;color:#5d4538}
.tip.bad{box-shadow:inset 3px 0 0 #d9603f,0 4px 10px rgba(120,80,50,.1)}.tip.good{box-shadow:inset 3px 0 0 #7a8f3a,0 4px 10px rgba(120,80,50,.1)}
.bunnysay{display:flex;gap:12px;align-items:center;margin-top:8px}.bunnysay img{width:64px;height:64px;border-radius:50%;box-shadow:var(--sh)}
.bunnysay div{background:var(--card);border-radius:20px;padding:12px 14px;font-size:13.5px;line-height:1.4;box-shadow:inset 0 2px 3px #fff}
.empty{text-align:center;padding:22px 16px;color:var(--mut);font-size:14px;line-height:1.45}.empty img{width:120px;height:120px;border-radius:50%;box-shadow:var(--sh);margin-bottom:10px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#4a3328;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hide{display:none!important}
textarea.f{height:90px;font-size:12px}
.alert{background:#fff3d6;border-radius:16px;padding:10px 12px;font-size:13px;margin:8px 0;color:#7a5a12;font-weight:600}

/* Rabbit edition: flat ink, tangerine and mint. Data format remains money_v1. */
:root{--bg:#fff8ec;--card:#fffdf7;--ink:#20231f;--mut:#62665e;--pink:#f5b8ce;--coin:#ff850a;--olive:#327452;--line:#d9dccf;--sh:3px 4px 0 #20231f}
.hdr{background:#ff850a;border-bottom:2px solid var(--ink);padding-bottom:14px}
.hrow{gap:12px}.hrow img{width:55px;height:55px;border:2px solid var(--ink);border-radius:16px;box-shadow:2px 2px 0 var(--ink)}
.brand{flex:1}.brand small{display:block;font-size:11px;font-weight:650;margin-top:3px}.hrow h1{font-size:23px;letter-spacing:-.7px}
.gear{width:44px;height:44px;border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink);background:#fff8ec}
.st{border:2px solid var(--ink);border-radius:16px;box-shadow:2px 3px 0 var(--ink);padding:9px 8px;background:#fff8ec}.st:nth-child(2){background:#bce6cc}.st:nth-child(3){background:#ffdd78}.st.pk b{color:var(--ink)}.st span{color:#42473f}.st i{color:#4c5549}
.page{padding:8px 12px 32px}.sec{border:2px solid var(--ink);border-radius:22px;box-shadow:3px 4px 0 var(--ink);padding:13px 7px 12px;margin:12px 0 18px}.sec h2{font-size:12px;color:var(--ink);letter-spacing:.07em;margin-bottom:6px}
.cell{padding-bottom:8px}.orb{background:var(--c);border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink)}.orb .bt{color:var(--ink);text-shadow:none}.orb.ghost{background:#fff8ec;border:2px dashed #777c71;box-shadow:none;color:#42473f}.orbw{background:conic-gradient(var(--c) calc(var(--p,0)*1%),#e2e6dc 0)}
.amt u,.warn{color:#a33d20}.hint{color:#62665e}.cell .nm{font-size:12px;height:17px}
nav{border-top:2px solid var(--ink);border-radius:0;background:#fffdf7;box-shadow:none;gap:4px}nav button{min-height:52px;border:2px solid transparent;border-radius:14px;color:#62665e;font-size:10px}nav button.on{background:#bce6cc;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.sheetbg{background:rgba(32,35,31,.5)}.sheet{border:2px solid var(--ink);border-bottom:0;background:#fff8ec}.f{border:2px solid #92998b;box-shadow:none;background:#fffdf7}.f:focus{border-color:#20231f;box-shadow:0 0 0 3px #bce6cc}label{color:#42473f}
.btn{border:2px solid var(--ink);border-radius:16px;background:#ffad55;color:var(--ink);box-shadow:3px 4px 0 var(--ink)}.btn.alt{background:#bce6cc;box-shadow:3px 4px 0 var(--ink)}.btn.del{border:0;box-shadow:none;background:none;color:#a33d20}.btn:active,.gear:active{transform:translate(2px,2px);box-shadow:none}
.big,.sumrow div,.tip{border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink);background:#fffdf7}.tip p{color:#41483d}.tip.bad{background:#ffeadf;box-shadow:3px 4px 0 var(--ink)}.tip.good{background:#dcefe1;box-shadow:3px 4px 0 var(--ink)}
.seg{border:2px solid var(--ink);box-shadow:none;padding:4px}.seg button.on{background:#bce6cc;box-shadow:none}.chip{border:2px solid var(--ink);box-shadow:none;min-height:44px}.chip.on{background:#ffad55;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.bunnysay img{border:2px solid var(--ink);border-radius:18px;box-shadow:2px 3px 0 var(--ink)}.bunnysay div{border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink);background:#bce6cc}.empty{padding:20px 12px}.empty img{width:144px;height:144px;border:2px solid var(--ink);border-radius:26px;box-shadow:3px 4px 0 var(--ink)}
.hrw{min-height:58px}.hrw .ic{box-shadow:none;border:1.5px solid var(--ink);background:#bce6cc}.hrw .am.in b{color:#27613e}.sw button{border:2px solid var(--ink);box-shadow:none;width:36px;height:36px}.icgrid{border:2px solid var(--ink);box-shadow:none}.icgrid button{min-height:40px}.icgrid button.on{background:#bce6cc;box-shadow:none}.bar div{background:#327452}.toast,.banner{background:#20231f}.alert{border:2px solid #9e691c;background:#fff0c6;color:#644313}
button{cursor:pointer}button:focus-visible,.cell:focus-visible{outline:3px solid #4670c8;outline-offset:4px}
@media(min-width:700px){body{max-width:760px;margin:0 auto;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}html{background:#eadcc6}.page{padding:12px 24px 40px}.hdr{padding-left:24px;padding-right:24px}.st b{font-size:21px}.st span{font-size:12px}.st i{font-size:13px}.sec{padding:16px}.cell .nm{font-size:14px;height:20px}.orb{width:70px;height:70px}.amt b{font-size:14px}.amt i{font-size:12px}.hrow h1{font-size:27px}.brand small{font-size:13px}}
@media(max-width:360px){.orb{width:54px;height:54px}.hrow h1{font-size:20px}.st b{font-size:13px}.st span{font-size:9px}.icgrid{grid-template-columns:repeat(6,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

textarea.f.op-note{min-height:140px;height:140px;font-size:16px;line-height:1.5;resize:vertical;overflow:hidden}
.saved-note{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;margin:10px 0;-webkit-user-select:text;user-select:text}
.income-photo{display:block;max-width:100%;max-height:55dvh;width:auto;height:auto;object-fit:contain;margin:12px auto;border:2px solid var(--ink);border-radius:16px}
.hrw .tx i{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.btn:disabled{opacity:.5;cursor:wait}
</style>
</head>
<body>
<div class="hdr">
  <div class="hrow"><img src="bunny.png" alt="Зайчик-бухгалтер"><div class="brand"><h1>Мои деньги</h1><small>Твой ушастый бухгалтер</small></div><button class="gear" id="gear" aria-label="Настройки">⚙️</button></div>
  <div class="stats" id="stats"></div>
</div>
<div id="pages">
  <div class="page" id="pg0"></div>
  <div class="page" id="pg1"></div>
  <div class="page" id="pg2"></div>
  <div class="page" id="pg3"></div>
</div>
<nav id="nav">
  <button data-i="0" class="on"><span>🐰</span>ДЕНЬГИ</button>
  <button data-i="1"><span>🍩</span>АНАЛИТИКА</button>
  <button data-i="2"><span>💡</span>СОВЕТЫ</button>

<script>
(function(){
'use strict';
/* ================= базовое ================= */
var KEY='money_v1',RKEY='money_rates_v1',MAXAGE=3*3600*1000;
var CUR={RUB:{s:'₽',n:'Рубли',f:'🇷🇺'},AED:{s:'AED',n:'Дирхамы',f:'🇦🇪'},USD:{s:'$',n:'Доллары',f:'🇺🇸'},EUR:{s:'€',n:'Евро',f:'🇪🇺'},TRY:{s:'₺',n:'Лиры',f:'🇹🇷'},AMD:{s:'֏',n:'Драмы',f:'🇦🇲'}};
var CODES=Object.keys(CUR);
var FB={USD:1,RUB:84.989692,EUR:0.892383,AED:3.6725,AMD:361.957381,TRY:49.339277};
var R=Object.assign({},FB),RI={date:'2026-10-10',live:false,t:0};
var COLORS=['#bce6cc','#ffad55','#ffdd78','#cfc4f4','#f5b8ce','#a9d9ed','#e5d6ba','#ef967d'];
var DEF={src:'#ffdd78',wal:'#bce6cc',goal:'#cfc4f4',cat:'#f5b8ce'};
var S=blank(),D={},swallow=0,pick=null,period='m0';
function blank(){return{v:1,set:{main:'RUB',bk:0},src:[],wal:[],goal:[],cat:[],ops:[]}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fd(s){if(!s)return'';var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function fds(s){var p=s.split('-');return p[2]+'.'+p[1]}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},2000)}
function find(k,id){return S[k].filter(function(x){return x.id===id})[0]}
function r2(n){return Math.round(n*100)/100}
function parse(v){v=String(v||'').replace(/\s/g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)?n:NaN}
function conv(a,f,t){return f===t?a:a/R[f]*R[t]}
function fmt(n,cur,ap){
  if(!isFinite(n))n=0;var abs=Math.abs(n),mx=ap?(abs>=100?0:2):(abs>=10000?0:2);
  if(cur==='AMD')mx=0;
  var s=n.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:mx}).replace('-','−');
  var c=CUR[cur].s;return(cur==='USD'||cur==='EUR')?(n<0?'−':'')+c+s.replace('−',''):s+' '+c;
}
function two(rub,aed){var m=S.set.main==='AED';return '<b>'+fmt(m?aed:rub,m?'AED':'RUB',true)+'</b><i>'+fmt(m?rub:aed,m?'RUB':'AED',true)+'</i>'}
function lines(a,cur){ // сумма в своей валюте + RUB/AED
  var h='<b>'+fmt(a,cur)+'</b>';
  if(cur!=='RUB')h+='<i>'+fmt(conv(a,cur,'RUB'),'RUB',true)+'</i>';
  if(cur!=='AED')h+='<i>'+fmt(conv(a,cur,'AED'),'AED',true)+'</i>';
  return h;
}
function bothTxt(a,cur){var p=[];if(cur!=='RUB')p.push(fmt(conv(a,cur,'RUB'),'RUB',true));if(cur!=='AED')p.push(fmt(conv(a,cur,'AED'),'AED',true));
  if(cur==='RUB'||cur==='AED'||true)return '≈ '+p.join(' · ')}
function sum2(cur,aed){return fmt(aed,'AED',true)+' (≈ '+fmt(aed*R.RUB/R.AED,'RUB',true)+')'}

/* ================= хранение ================= */
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===1&&Array.isArray(d.ops)){S=d;S.set=Object.assign({main:'RUB',bk:0},S.set||{});['src','wal','goal','cat'].forEach(function(k){S[k]=S[k]||[]})}}catch(e){}
  try{var r=JSON.parse(localStorage.getItem(RKEY));if(r&&r.R&&r.R.RUB){R=Object.assign({},FB,r.R);RI=r.I}}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Не удалось сохранить: память заполнена. Убери фото или освободи место.');return false}}
function getJSON(u){var c=new AbortController(),t=setTimeout(function(){c.abort()},9000);return fetch(u,{signal:c.signal,cache:'no-store'}).then(function(r){clearTimeout(t);if(!r.ok)throw 0;return r.json()})}
function loadRates(force){
  if(!force&&RI.live&&RI.t&&Date.now()-RI.t<MAXAGE)return Promise.resolve();
  return getJSON('https://open.er-api.com/v6/latest/USD').then(function(j){
    if(j.result!=='success')throw 0;var n={USD:1};CODES.forEach(function(c){if(!(j.rates[c]>0))throw 0;n[c]=j.rates[c]});
    return{R:n,I:{date:new Date(j.time_last_update_utc).toISOString().slice(0,10),live:true,t:Date.now()}}
  }).catch(function(){return getJSON('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json').then(function(j){
    var n={USD:1};CODES.forEach(function(c){var v=j.usd[c.toLowerCase()];if(!(v>0))throw 0;n[c]=v});return{R:n,I:{date:j.date,live:true,t:Date.now()}}})
  }).then(function(x){R=x.R;RI=x.I;try{localStorage.setItem(RKEY,JSON.stringify(x))}catch(e){}render();if(force)toast('Курс обновлён')})
  .catch(function(){RI.live=false;if(force)toast('Не удалось обновить курс');render()})
}

/* ================= расчёты ================= */
function compute(){
  D={bal:{},res:{},rwg:{},gres:{},gpaid:{}};
  S.wal.forEach(function(w){D.bal[w.id]=+w.init||0;D.res[w.id]=0});
  S.goal.forEach(function(g){D.gres[g.id]=0;D.gpaid[g.id]=0});
  S.ops.forEach(function(o){
    if(!(o.w in D.bal))return;var k=o.w+'|'+o.x;
    if(o.t==='inc')D.bal[o.w]+=o.a;
    else if(o.t==='exp')D.bal[o.w]-=o.a;
    else if(o.t==='tr'){if(!(o.x in D.bal))return;D.bal[o.w]-=o.a;D.bal[o.x]+=o.b}
    else if(o.t==='res'){if(!(o.x in D.gres))return;D.res[o.w]+=o.a;D.gres[o.x]+=o.b;D.rwg[k]=(D.rwg[k]||0)+o.a}
    else if(o.t==='pay'){if(!(o.x in D.gres))return;D.bal[o.w]-=o.a;D.res[o.w]-=o.r;D.gres[o.x]-=o.rb;D.gpaid[o.x]+=o.b;D.rwg[k]=(D.rwg[k]||0)-o.r}
  });
  Object.keys(D.bal).forEach(function(k){D.bal[k]=r2(D.bal[k])});
}
function free(w){return r2(D.bal[w.id]-D.res[w.id])}
function total(fn,cur){return S.wal.reduce(function(s,w){return s+conv(fn(w),w.cur,cur)},0)}
function ym(offset){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+(offset||0));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
var MN=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
function mname(s){return MN[+s.slice(5,7)-1]}
function inPeriod(o,p){
  var d=o.d;
  if(p==='all')return true;
  if(p==='m0')return d.slice(0,7)===ym(0);
  if(p==='m1')return d.slice(0,7)===ym(-1);
  if(p==='d7'){var t=new Date();t.setDate(t.getDate()-6);var s=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);return d>=s}
  return true;
}
function catSums(p){var m={};S.ops.forEach(function(o){if(o.t==='exp'&&inPeriod(o,p)){var c=m[o.x]||(m[o.x]={aed:0,rub:0,n:0});c.aed+=o.aed;c.rub+=o.rub;c.n++}});return m}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function goalInfo(g){
  var res=D.gres[g.id]||0,paid=D.gpaid[g.id]||0,rem=Math.max(0,g.target-paid),toSave=Math.max(0,rem-res);
  var days=g.deadline?dayDiff(today(),g.deadline)+1:null;
  return{res:r2(res),paid:r2(paid),rem:r2(rem),toSave:r2(toSave),days:days,pct:g.target>0?Math.min(100,Math.round((paid+res)/g.target*100)):0,done:rem<=0.005};
}

var EMO=EM.split('|').map(function(l){var i=l.indexOf(' ');var e=l.slice(0,i);return[e,l.slice(i+1)]});
function emBest(q){var w=q.trim().toLowerCase().split(/\s+/).filter(function(t){return t.length>2}),best=null,bs=0;EMO.forEach(function(x){var sc=0;w.forEach(function(t){var st=t.slice(0,Math.max(3,t.length-2));if(x[1].indexOf(t)>=0)sc+=2;else if(x[1].indexOf(st)>=0)sc+=1});if(sc>bs){bs=sc;best=x[0]}});return best}
function emSearch(q){q=q.trim().toLowerCase();if(!q)return EMO;var w=q.split(/\s+/);return EMO.filter(function(x){return w.every(function(t){return x[1].indexOf(t)>=0||x[1].indexOf(t.slice(0,Math.max(3,t.length-2)))>=0})})}
function iconH(ic){
  if(!ic)return'⭐';if(ic.indexOf('data:')===0)return'<img src="'+ic+'" alt="Зайчик-бухгалтер">';
  if(ic.charAt(0)==='#')return'<span class="bt">'+esc(ic.slice(1))+'</span>';return esc(ic)}
function orbH(it,k){return '<div class="orb" style="--c:'+(it.color||DEF[k])+'">'+iconH(it.icon)+'</div>'}

/* ================= отрисовка ================= */
function render(){compute();stats();pageMain();pageAnalytics();pageAdvice();pageJournal()}
function stats(){
  var bal=total(function(w){return D.bal[w.id]},'RUB'),balA=total(function(w){return D.bal[w.id]},'AED');
  var rs=total(function(w){return D.res[w.id]},'RUB'),rsA=total(function(w){return D.res[w.id]},'AED');
  var c=catSums('m0'),er=0,ea=0;Object.keys(c).forEach(function(k){er+=c[k].rub;ea+=c[k].aed});
  function box(l,r,a,cl){return '<div class="st '+(cl||'')+'"><span>'+l+'</span>'+two(r,a)+'</div>'}
  $('stats').innerHTML=box('Баланс',bal,balA)+box('Отложено',rs,rsA,'pk')+box('Расходы · '+mname(ym(0)).slice(0,3),er,ea);
}
function cell(k,it,body,ring){
  var st='';var pr=ring!=null?'--p:'+ring+';':'';
  return '<div class="cell" data-k="'+k+'" data-id="'+it.id+'"><div class="nm">'+esc(it.name)+'</div><div class="orbw'+(ring==null?' noring':'')+'" style="'+pr+'--c:'+(it.color||DEF[k])+'">'+orbH(it,k)+'</div><div class="amt">'+body+'</div></div>';
}
function addCell(k,label){return '<div class="cell" data-add="'+k+'"><div class="nm"></div><div class="orbw noring"><div class="orb ghost">＋</div></div><div class="amt"><i>'+label+'</i></div></div>'}
function backupBanner(){
  if(!S.ops.length&&!S.wal.length)return'';
  var days=S.set.bk?Math.floor((Date.now()-S.set.bk)/86400000):999;
  return days>=7?'<div class="alert" id="bkAlert">💾 '+(S.set.bk?'Копию данных делали '+days+' дн. назад.':'Копию данных ещё не делали.')+' Нажми, чтобы сохранить.</div>':'';
}
function pageMain(){
  var h=backupBanner();
  if(!S.wal.length&&!S.src.length&&!S.cat.length&&!S.goal.length){
    h+='<div class="empty"><img src="bunny.png" alt="Зайчик-бухгалтер"><br><b style="color:var(--ink);font-size:17px">Так, что у нас с деньгами?</b><br>Добавь кошельки (наличные, карты), источник дохода и категории расходов. Потом просто перетаскивай ячейки друг на друга.<button class="btn" id="quick">✨ Добавить типичные категории и кошельки</button></div>';
  }
  var ms=catSums('m0'),mi={};S.ops.forEach(function(o){if(o.t==='inc'&&inPeriod(o,'m0')){var c=mi[o.x]||(mi[o.x]={a:0,r:0});c.a+=o.aed;c.r+=o.rub}});
  h+='<div class="sec"><h2>ДОХОДЫ · '+mname(ym(0)).toUpperCase()+'</h2><div class="grid">'+S.src.map(function(s){var m=mi[s.id]||{a:0,r:0};return cell('src',s,two(m.r,m.a))}).join('')+addCell('src','источник')+'</div></div>';
  h+='<div class="sec"><h2>КОШЕЛЬКИ</h2><div class="grid">'+S.wal.map(function(w){
    var b=D.bal[w.id],rs=D.res[w.id];var body=lines(b,w.cur);if(rs>0.004)body+='<u>🔒 '+fmt(rs,w.cur)+'</u>';return cell('wal',w,body)}).join('')+addCell('wal','кошелёк')+'</div>'+(S.wal.length?'<div class="hint">🔒 — отложено на цели, деньги лежат на месте.</div>':'')+'</div>';
  h+='<div class="sec"><h2>РАСХОДЫ · '+mname(ym(0)).toUpperCase()+'</h2><div class="grid">'+S.cat.map(function(c){var m=ms[c.id]||{rub:0,aed:0};return cell('cat',c,two(m.rub,m.aed))}).join('')+addCell('cat','категория')+'</div></div>';
  h+='<div class="sec"><h2>ЦЕЛИ И ДОЛГИ</h2><div class="grid">'+S.goal.map(function(g){var gi=goalInfo(g);
    var body=gi.done?'<b>✓ готово</b>':'<b>'+fmt(gi.toSave,g.cur)+'</b><i>'+(g.cur==='RUB'?fmt(conv(gi.toSave,g.cur,'AED'),'AED',true):fmt(conv(gi.toSave,g.cur,'RUB'),'RUB',true))+'</i>';
    if(g.deadline&&!gi.done)body+='<u>до '+fds(g.deadline)+(gi.days<0?' · просрочено':'')+'</u>';
    return cell('goal',g,body,gi.pct)}).join('')+addCell('goal','цель')+'</div>'+(S.goal.length?'<div class="hint">Под кружком — сколько ещё осталось накопить. Кольцо — сколько уже отложено или выплачено.</div>':'')+'</div>';

  if(S.wal.length)h+='<div class="hint" style="text-align:center;margin-top:14px">Зажми кружок дохода или кошелька и перетащи на другой. Или нажми на кружок и выбери «Перевести».</div>';

function compressPhoto(file){
  return new Promise(function(resolve,reject){
    if(file.type&&file.type.indexOf('image/')!==0){reject(new Error('image required'));return}
    var url=URL.createObjectURL(file),img=new Image(),done=false;
    var timer=setTimeout(function(){finish(new Error('timeout'))},20000);
    function finish(error,data){if(done)return;done=true;clearTimeout(timer);URL.revokeObjectURL(url);if(error)reject(error);else resolve(data)}
    img.onerror=function(){finish(new Error('decode'))};
    img.onload=function(){try{
      var scale=Math.min(1,720/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
      var ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
      var quality=.78,data=canvas.toDataURL('image/jpeg',quality);
      while(data.length>180000&&quality>.35){quality-=.1;data=canvas.toDataURL('image/jpeg',quality)}
      if(data.length>220000){var small=document.createElement('canvas');small.width=Math.max(1,Math.round(canvas.width*.65));small.height=Math.max(1,Math.round(canvas.height*.65));small.getContext('2d').drawImage(canvas,0,0,small.width,small.height);data=small.toDataURL('image/jpeg',.55)}
      finish(null,data);
    }catch(error){finish(error)}};img.src=url;
  });
}

/* ================= перетаскивание ================= */
function validT(sk,dk){return(sk==='src'&&dk==='wal')||(sk==='wal'&&(dk==='wal'||dk==='cat'||dk==='goal'))}
function cellAt(x,y){var els=document.elementsFromPoint(x,y);for(var i=0;i<els.length;i++){var c=els[i].closest&&els[i].closest('.cell[data-k]');if(c)return c}return null}
function hit(x,y){var k=st.c.dataset.k,a=cellAt(x,y-39),b=cellAt(x,y);function ok(c){return c&&c!==st.c&&validT(k,c.dataset.k)}return ok(a)?a:ok(b)?b:null}
var st=null,ghost=null,scrollT=null,lastY=0;
function begin(x,y){
  st.on=true;document.body.classList.add('dragging');
  var o=st.c.querySelector('.orb');ghost=document.createElement('div');ghost.className='dghost';ghost.appendChild(o.cloneNode(true));ghost.firstChild.style.setProperty('--c',st.c.querySelector('.orbw').style.getPropertyValue('--c'));document.body.appendChild(ghost);
  st.c.classList.add('lift');var sk=st.c.dataset.k;
  document.querySelectorAll('#pg0 .cell[data-k]').forEach(function(c){if(c!==st.c&&validT(sk,c.dataset.k))c.classList.add('tgt')});
  if(navigator.vibrate)try{navigator.vibrate(12)}catch(e){}
  mv(x,y);
  scrollT=setInterval(function(){var p=$('pg0');if(lastY>innerHeight-120)p.scrollTop+=9;else if(lastY<190)p.scrollTop-=9},16);
}
function mv(x,y){lastY=y;ghost.style.transform='translate('+(x-31)+'px,'+(y-70)+'px) scale(1.15)';
  document.querySelectorAll('.cell.hov').forEach(function(c){c.classList.remove('hov')});
  var c=hit(x,y);if(c)c.classList.add('hov')}
function end(x,y,cancel){
  clearTimeout(st.tm);clearInterval(scrollT);
  if(st.on){
    var c=cancel?null:hit(x,y);var sc=st.c;
    document.body.classList.remove('dragging');sc.classList.remove('lift');if(ghost){ghost.remove();ghost=null}
    document.querySelectorAll('.cell.tgt,.cell.hov').forEach(function(e){e.classList.remove('tgt','hov')});
    swallow=Date.now()+450;
    if(c&&c!==sc&&validT(sc.dataset.k,c.dataset.k))amountSheet(sc.dataset.k,sc.dataset.id,c.dataset.k,c.dataset.id);
  }
  st=null;
}
function bindDrag(){
  var root=$('pg0');
  root.addEventListener('touchstart',function(e){
    if(st)return;var c=e.target.closest('.cell[data-k]');if(!c||(c.dataset.k!=='src'&&c.dataset.k!=='wal'))return;
    var t=e.touches[0];st={c:c,x:t.clientX,y:t.clientY,on:false,touch:true};st.tm=setTimeout(function(){if(st&&!st.on)begin(st.x,st.y)},260);
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!st||!st.touch)return;var t=e.touches[0];
    if(!st.on){if(Math.abs(t.clientX-st.x)>9||Math.abs(t.clientY-st.y)>9){clearTimeout(st.tm);st=null}return}
    e.preventDefault();mv(t.clientX,t.clientY);st.lx=t.clientX;st.ly=t.clientY;
  },{passive:false});
  document.addEventListener('touchend',function(e){if(!st||!st.touch)return;if(st.on){e.preventDefault();var t=e.changedTouches[0];end(t.clientX,t.clientY)}else{clearTimeout(st.tm);st=null}},{passive:false});
  document.addEventListener('touchcancel',function(){if(st&&st.touch)end(0,0,true)});
  root.addEventListener('mousedown',function(e){
    if(st||e.button!==0)return;var c=e.target.closest('.cell[data-k]');if(!c||(c.dataset.k!=='src'&&c.dataset.k!=='wal'))return;
    st={c:c,x:e.clientX,y:e.clientY,on:false,touch:false};
  });
  document.addEventListener('mousemove',function(e){
    if(!st||st.touch)return;if(!st.on){if(Math.abs(e.clientX-st.x)+Math.abs(e.clientY-st.y)>6)begin(e.clientX,e.clientY);return}mv(e.clientX,e.clientY)});
  document.addEventListener('mouseup',function(e){if(!st||st.touch)return;end(e.clientX,e.clientY)});
  document.addEventListener('contextmenu',function(e){if(st&&st.on)e.preventDefault()});
}
function startPick(k,id){
  pick={k:k,id:id};var it=find(k,id);$('bannerT').textContent='«'+it.name+'»: нажми, куда перевести';$('banner').classList.add('show');
  document.body.classList.add('dragging');document.querySelectorAll('#pg0 .cell[data-k]').forEach(function(c){if(!(c.dataset.k===k&&c.dataset.id===id)&&validT(k,c.dataset.k))c.classList.add('tgt')});
  $('pages').scrollTo({left:0,behavior:'smooth'});
}
function endPick(){pick=null;$('banner').classList.remove('show');document.body.classList.remove('dragging');document.querySelectorAll('.cell.tgt').forEach(function(c){c.classList.remove('tgt')})}

/* ================= события ================= */
function bind(){
  bindDrag();
  $('pg0').addEventListener('click',function(e){
    if(Date.now()<swallow)return;
    if(e.target.closest('#bkAlert')){settingsSheet();return}
    if(e.target.closest('#quick')){quickStart();return}
    var a=e.target.closest('[data-add]');if(a&&!pick){itemSheet(a.getAttribute('data-add'));return}
    var c=e.target.closest('.cell[data-k]');if(!c)return;var k=c.dataset.k,id=c.dataset.id;
    if(pick){var p=pick;if(validT(p.k,k)&&!(p.k===k&&p.id===id)){endPick();amountSheet(p.k,p.id,k,id)}else endPick();return}
    detailSheet(k,id);
  });
  $('bannerX').onclick=endPick;
  $('gear').onclick=settingsSheet;
  $('bg').addEventListener('click',function(e){if(e.target===$('bg'))closeSheet()});
  $('pg1').addEventListener('click',function(e){var b=e.target.closest('[data-p]');if(b){period=b.getAttribute('data-p');pageAnalytics()}});
  $('pg3').addEventListener('click',function(e){var b=e.target.closest('[data-op]');if(b){opSheet(b.getAttribute('data-op'));return}if(e.target.id==='more'){jLimit+=60;pageJournal()}});
  $('sheet').addEventListener('click',function(e){var b=e.target.closest('[data-op]');if(b)opSheet(b.getAttribute('data-op'))});
  $('nav').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var i=+b.getAttribute('data-i');$('pages').scrollTo({left:i*$('pages').clientWidth,behavior:'smooth'})});
  var sc;$('pages').addEventListener('scroll',function(){clearTimeout(sc);sc=setTimeout(function(){var i=Math.round($('pages').scrollLeft/$('pages').clientWidth);document.querySelectorAll('#nav button').forEach(function(b,j){b.classList.toggle('on',i===j)})},60)});
}
load();bind();render();loadRates(false);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
window.__money={get S(){return S},render:render};
})();
</script>
